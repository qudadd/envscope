[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "envscope"
version = "0.21.0"
description = "Minimal desktop environment checks, guarded accounts and practical maintenance tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "envscope/vendor/claude_switcher/LICENSE"]
authors = [{name = "EnvScope contributors"}]
dependencies = ["cryptography>=46,<51", "psutil>=7.2,<8", "ruamel.yaml>=0.19.1,<0.20"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: System :: Networking :: Monitoring",
]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1", "pystray==0.19.5", "Pillow==12.3.0"]

[project.scripts]
envscope = "envscope.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["envscope*"]
exclude = ["envscope.vendor*"]
