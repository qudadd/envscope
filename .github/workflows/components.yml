name: Native legacy component migration
on:
  workflow_dispatch:
  push:
    branches: [codex/legacy-component-migration]
permissions:
  contents: read
jobs:
  owned-jobs:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest tests.test_components -v
      - name: Unique inert jobs, no production settings or vendor scripts
        env:
          ENVSCOPE_COMPONENTS_ACCEPTANCE: '1'
        run: python -m scripts.components_acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Components-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/components-acceptance/result.json
          if-no-files-found: error
