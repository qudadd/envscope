name: WireGuard service inspection
on:
  workflow_dispatch:
  push:
    branches: [codex/native-components]
    paths:
      - envscope/wireguard.py
      - envscope/process_guard.py
      - scripts/wireguard_acceptance.py
      - tests/test_wireguard.py
      - .github/workflows/wireguard.yml
permissions:
  contents: read
jobs:
  owned-service:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest tests.test_wireguard tests.test_process_guard -q
      - name: Read only one inert owned service, no VPN or driver
        env:
          ENVSCOPE_SERVICE_ACCEPTANCE: '1'
        run: python -m scripts.wireguard_acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WireGuard-owned-service-Windows-X64
          path: artifacts/wireguard-service/result.json
          if-no-files-found: error
