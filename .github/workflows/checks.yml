name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Independent .NET CSNAP001 exchange (fixtures only)
        if: runner.os == 'Windows'
        run: python -m scripts.csnap_acceptance
      - name: Detached browser cleanup after parent exit (owned processes only)
        if: runner.os != 'Linux'
        run: python -m scripts.browser_session_acceptance
      - run: node --test tests/browser.test.mjs
      - run: node --check envscope/web/app.mjs
      - run: node --check envscope/web/controls.mjs
      - run: node --check envscope/web/diagnosis.mjs
      - run: node --check envscope/web/guide.mjs
      - run: node --check envscope/web/inspection.mjs
      - run: node --check envscope/web/connection.mjs
      - run: node --check envscope/web/desktop.mjs
      - run: node --check envscope/web/target.mjs
      - run: node --check envscope/web/coverage.mjs
      - run: node --check envscope/web/process_guard_ui.mjs
      - run: node --check envscope/web/components_ui.mjs
      - run: node --check envscope/web/account_recovery_ui.mjs
      - run: node --check envscope/web/routing_ui.mjs
      - run: node --check envscope/web/timezone_ui.mjs
      - run: node --check envscope/web/network_ui.mjs
      - run: node --check envscope/web/client_ui.mjs
      - run: node --check envscope/web/check_preferences_ui.mjs
      - run: python -m scripts.check_release
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m scripts.verify_package dist
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright .
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.browser_smoke
      - run: python -m scripts.usability_smoke
      - run: python -m scripts.desktop_ui_smoke
      - run: python -m scripts.target_environment_smoke
      - run: python -m scripts.coverage_smoke
      - run: python -m scripts.browser_recovery_smoke
      - run: python -m scripts.selection_smoke
      - run: python -m scripts.check_preferences_smoke
      - run: python -m scripts.region_lookup_smoke
      - run: python -m scripts.watchdog_smoke
      - run: python -m scripts.process_guard_smoke
      - run: python -m scripts.components_smoke
      - run: python -m scripts.software_smoke
      - run: python -m scripts.account_recovery_smoke
      - run: python -m scripts.routing_smoke
      - run: python -m scripts.timezone_service_smoke
      - run: python -m scripts.system_network_smoke
      - run: python -m scripts.client_repair_smoke
      - run: python -m scripts.language_smoke
      - run: python -m scripts.wireguard_smoke
