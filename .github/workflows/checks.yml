name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/browser.test.mjs
      - run: node --check envscope/web/app.mjs
      - run: node --check envscope/web/controls.mjs
      - run: node --check envscope/web/diagnosis.mjs
      - run: node --check envscope/web/guide.mjs
      - run: python -m scripts.check_release
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m scripts.verify_package dist
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.browser_smoke
