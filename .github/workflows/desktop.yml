name: desktop packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platform to verify
        type: choice
        default: all
        options: [all, windows-latest, macos-latest, macos-15-intel]
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["windows-latest", "macos-latest", "macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build self-contained cryptography on macOS Intel
        if: matrix.os == 'macos-15-intel'
        env:
          OPENSSL_STATIC: '1'
        run: OPENSSL_DIR="$(brew --prefix openssl@3)" python -m pip install --no-cache-dir --no-binary=cryptography 'cryptography>=50.0.2,<51'
      - run: python -m pip install 'pyinstaller>=6.10,<7' '.[desktop]'
      - run: python -m scripts.check_release
      - run: python -m unittest discover -s tests -q
      - name: Independent .NET CSNAP001 exchange (fixtures only)
        if: runner.os == 'Windows'
        run: python -m scripts.csnap_acceptance
      - name: Detached browser cleanup after parent exit (owned processes only)
        run: python -m scripts.browser_session_acceptance
      - name: Actual encrypted DMG compatibility (isolated fixture)
        run: python -m scripts.dmg_acceptance
      - name: Actual root timezone service lifecycle (fixture paths only)
        if: runner.os == 'macOS'
        env:
          ENVSCOPE_TIMEZONE_ACCEPTANCE: '1'
        run: python -m scripts.timezone_acceptance
      - name: Actual SYSTEM timezone task lifecycle (fixture clock only)
        if: runner.os == 'Windows'
        env:
          ENVSCOPE_TIMEZONE_ACCEPTANCE: '1'
        run: python -m scripts.windows_timezone_acceptance
      - name: Actual local Mihomo routing and rollback (isolated fixture)
        run: python -m scripts.routing_core_smoke
      - name: Actual native client lifecycle (owned disposable GUI only)
        env:
          ENVSCOPE_CLIENT_ACCEPTANCE: '1'
        run: python -m scripts.client_lifecycle_acceptance
      - name: Actual Claude-language primitives (owned preference domain only)
        if: runner.os == 'macOS'
        env:
          ENVSCOPE_CLIENT_ACCEPTANCE: '1'
        run: python -m scripts.language_acceptance
      - name: Actual macOS network transactions (fixture paths only)
        if: runner.os == 'macOS'
        env:
          ENVSCOPE_NETWORK_ACCEPTANCE: '1'
        run: python -m scripts.network_acceptance
      - name: Actual Windows network ACL and transport (fixture bindings only)
        if: runner.os == 'Windows'
        env:
          ENVSCOPE_NETWORK_ACCEPTANCE: '1'
        run: python -m scripts.network_windows_acceptance
      - name: Actual read-only SCM and process inspection (owned inert service only)
        if: runner.os == 'Windows'
        env:
          ENVSCOPE_SERVICE_ACCEPTANCE: '1'
        run: python -m scripts.wireguard_acceptance
      - name: Actual legacy task migration (owned inert jobs only)
        env:
          ENVSCOPE_COMPONENTS_ACCEPTANCE: '1'
        run: python -m scripts.components_acceptance
      - run: python -m scripts.build_desktop
      - name: Frozen Windows smoke
        if: runner.os == 'Windows'
        run: python -m scripts.packaged_smoke dist/desktop/EnvScope/EnvScope.exe
      - name: Frozen macOS smoke
        if: runner.os == 'macOS'
        run: python -m scripts.packaged_smoke dist/desktop/EnvScope.app/Contents/MacOS/EnvScope
      - name: Actual Windows user scheduler lifecycle
        if: runner.os == 'Windows'
        env:
          ENVSCOPE_SCHEDULER_ACCEPTANCE: '1'
        run: python -m scripts.scheduler_acceptance dist/desktop/EnvScope/EnvScope.exe
      - name: Real archive update with isolated native startup
        run: python -m scripts.update_package_smoke
      - name: Actual macOS user scheduler lifecycle
        if: runner.os == 'macOS'
        env:
          ENVSCOPE_SCHEDULER_ACCEPTANCE: '1'
        run: python -m scripts.scheduler_acceptance dist/desktop/EnvScope.app/Contents/MacOS/EnvScope
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Client-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/client-lifecycle/result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: WireGuard-service-evidence-Windows-X64
          path: artifacts/wireguard-service/result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: Language-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/language-acceptance/result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Network-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/network*acceptance/result.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Timezone-evidence-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/timezone-acceptance/result.json
            artifacts/windows-timezone-acceptance.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DMG-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/dmg-acceptance/result.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: CSNAP-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/csnap-acceptance/result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Routing-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/routing-core/result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Update-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/update-package-smoke.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/native-smoke.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Browser-session-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/browser-session-acceptance/*result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Components-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/components-acceptance/result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Scheduler-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/scheduler-acceptance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: EnvScope-${{ runner.os }}-${{ runner.arch }}
          path: dist/EnvScope-*.zip
