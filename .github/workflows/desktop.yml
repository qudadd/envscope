name: desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pyinstaller>=6.10,<7' .
      - run: python -m unittest discover -s tests -q
      - run: python -m scripts.build_desktop
      - name: Frozen Windows smoke
        if: runner.os == 'Windows'
        run: python -m scripts.packaged_smoke dist/desktop/EnvScope/EnvScope.exe
      - name: Frozen macOS smoke
        if: runner.os == 'macOS'
        run: python -m scripts.packaged_smoke dist/desktop/EnvScope.app/Contents/MacOS/EnvScope
      - uses: actions/upload-artifact@v4
        with:
          name: EnvScope-${{ runner.os }}-${{ runner.arch }}
          path: dist/EnvScope-*.zip
