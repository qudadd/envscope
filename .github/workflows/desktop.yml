name: desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pyinstaller>=6.10,<7' .
      - run: python -m unittest discover -s tests -q
      - run: python -m scripts.build_desktop
      - uses: actions/upload-artifact@v4
        with:
          name: EnvScope-${{ runner.os }}-${{ runner.arch }}
          path: dist/EnvScope-*.zip
