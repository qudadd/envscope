name: desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pyinstaller>=6.10,<7' '.[desktop]'
      - run: python -m unittest discover -s tests -q
      - run: python -m scripts.build_desktop
      - name: Frozen Windows smoke
        if: runner.os == 'Windows'
        run: python -m scripts.packaged_smoke dist/desktop/EnvScope/EnvScope.exe
      - name: Frozen macOS smoke
        if: runner.os == 'macOS'
        run: python -m scripts.packaged_smoke dist/desktop/EnvScope.app/Contents/MacOS/EnvScope
      - name: Actual Windows user scheduler lifecycle
        if: runner.os == 'Windows'
        env:
          ENVSCOPE_SCHEDULER_ACCEPTANCE: '1'
        run: python -m scripts.scheduler_acceptance dist/desktop/EnvScope/EnvScope.exe
      - name: Real archive update with isolated native startup
        run: python -m scripts.update_package_smoke
      - name: Actual macOS user scheduler lifecycle
        if: runner.os == 'macOS'
        env:
          ENVSCOPE_SCHEDULER_ACCEPTANCE: '1'
        run: python -m scripts.scheduler_acceptance dist/desktop/EnvScope.app/Contents/MacOS/EnvScope
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Update-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/update-package-smoke.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/native-smoke.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Scheduler-evidence-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/scheduler-acceptance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: EnvScope-${{ runner.os }}-${{ runner.arch }}
          path: dist/EnvScope-*.zip
