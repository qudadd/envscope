name: native timezone service
on:
  workflow_dispatch:
  push:
    branches: [codex/native-timezone-service]
    paths:
      - native/timezone_worker.c
      - envscope/timezone_service.py
      - scripts/build_timezone_worker.py
      - scripts/timezone_acceptance.py
      - tests/test_timezone_service.py
      - .github/workflows/timezone.yml
permissions:
  contents: read
jobs:
  timezone:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest tests.test_timezone_service -q
      - name: Compile production worker (no installation)
        run: python -m scripts.build_timezone_worker
      - name: Actual root fixture lifecycle, never real timezone writes
        env:
          ENVSCOPE_TIMEZONE_ACCEPTANCE: '1'
        run: python -m scripts.timezone_acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Timezone-evidence-${{ runner.arch }}
          path: artifacts/timezone-acceptance
          if-no-files-found: warn
